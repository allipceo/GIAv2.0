📋 효성중공업 대상 록톤코리아 최종 영업 전략 및 보험 솔루션 제안
작성일시: 2025년 7월 19일 19:40 KST
수신: 조대표님 (록톤코리아 영업대표)
발신: 나반장 (효성중공업 프로젝트 담당 GEM)
참조: 노팀장 (Technical Advisor), 채팀장 (LLM 기반 분석 지원), 구차장 (LLM 기반 분석 지원), 마주임 (시각화 및 문서화 지원)

Executive Summary (핵심 요약)
효성중공업은 전력 슈퍼사이클의 최대 수혜기업이자 글로벌 전력 인프라 및 신재생에너지 시장을 선도하는 기업으로, 2025년 1분기 기준 매출액 9.3% 증가, 영업이익 82.3% 증가 등 폭발적인 성장세를 지속하고 있습니다. 이러한 성장은 필연적으로 대규모의 복합적인 글로벌 리스크를 동반하며, 이는 록톤코리아에게 연간 수백억 원 규모의 조단위 보험중개 기회를 제공합니다.

록톤코리아는 효성중공업의 우태희 대표이사 비전, 이재명 정부 정책 방향, 그리고 글로벌 사업 확장 니즈를 정확히 이해하고, 이에 최적화된 정책 전문성, 기술 전문성, 강력한 글로벌 네트워크, 그리고 차별화된 클레임 서비스를 결합한 통합 보험 솔루션을 제안합니다. 우리는 효성중공업의 단순한 보험 중개사를 넘어, 미래 성장을 함께하는 전략적 리스크 파트너로서의 역할을 수행할 것입니다.

핵심 기회:

미국 대형 프로젝트 보증보험: 테네시 멤피스 공장 및 기타 미국 내 대규모 에너지 프로젝트 수주에 따른 필수 보증보험 니즈.

국내 신재생 SPC 보험: 풍력-ESS 융합, 태양광 등 국내 신재생에너지 특수목적법인(SPC) 사업의 PF 연계 보험 니즈.

우태희 대표이사 관계 레버리지: 신재생에너지 정책 전문성과 기술 비전을 활용한 전략적 파트너십 구축.

이재명 정부 정책 연계 보험: 해외 진출 지원, 데이터센터 투자, 신재생에너지 확대 정책과 연계한 맞춤형 보험 솔루션.

록톤의 차별화:

독립성: 특정 보험사에 종속되지 않고 효성중공업의 이익을 최우선으로 하는 최적의 솔루션 제공.

글로벌 네트워크: 140개국 이상 네트워크를 통한 해외 거점별 현지 전문성과 통합 관리 역량.

산업별/기술별 전문성: 중공업, 플랜트, 신재생에너지(HVDC, ESS, 수소) 등 효성중공업 핵심 사업 및 신기술에 대한 깊은 이해와 맞춤형 리스크 컨설팅.

클레임 서비스 전문성: 사고 발생 시 고객 입장에서 신속하고 공정한 클레임 처리를 지원하는 독보적인 역량 (록톤의 98% 클레임 성공률).

정책 연계 전문성: 정부 정책 변화를 이해하고 선제적으로 보험 솔루션을 제안하는 능력.

I. 효성중공업 사업 현황 및 성장 동력 분석
1.1 재무 성과 및 시장 위상
효성중공업은 2025년 1분기 기준 매출액 9.3% 증가, 영업이익 82.3% 증가, 당기순이익 371.7% 증가를 기록하며 놀라운 수익성 개선을 보여주고 있습니다. 이는 전력기기 수요 증가와 건설 부문의 안정적 실적에 기인합니다. 현재 효성그룹 내 시가총액 1위 기업으로 부상하며 시장의 높은 평가를 받고 있습니다.

1.2 핵심 사업 영역 및 기술력
전력기기: 1977년 첫 차단기 생산 이래 누적 생산액 10조 원을 돌파하며 전 세계 40여 개국에 공급하는 글로벌 선두 기업입니다.

차세대 기술: 국내 최초 200MW급 전압형 HVDC 기술 개발, 경남 밀양 부북변전소 국내 최대 용량 ESS 설치, 강원도 액화수소충전소 구축 협약 등 HVDC, ESS, 수소 분야에서 차세대 기술을 선도하고 있습니다.

1.3 글로벌 사업 확장
미국은 효성중공업 수출의 40%를 차지하는 최대 시장이며, 테네시주 멤피스에 초고압 변압기 공장을 운영 중입니다. 이 외에도 인도, 중국에 제조 거점을 두고 있으며, 사우디 네옴시티 등 중동 지역 대형 프로젝트에도 참여하며 글로벌 확장을 가속화하고 있습니다. 전 세계 29개국 77개 도시에서 119개 사업장을 운영 중입니다.

II. 효성중공업 핵심 리스크 및 보험 니즈
효성중공업의 급격한 성장과 글로벌 확장은 다음과 같은 복합적인 리스크를 동반하며, 이에 대한 맞춤형 보험 솔루션이 필수적입니다.

2.1 글로벌 사업 확장 리스크
정치적 리스크: 나미비아(200억 원 규모), 에티오피아(2,356억 원 규모) 등 신흥국 프로젝트 증가에 따른 수용, 전쟁, 통화 전환 제한, 계약 파기 등의 위험.

환율 리스크: 수출 비중 44.3%로 환율 변동에 따른 수익성 영향.

프로젝트 지연 리스크: 대형 인프라 프로젝트 특성상 공기 지연 및 손실 발생 가능성.

보험 니즈: 정치적 위험 보험 (Political Risk Insurance), 환율 헤지 보험, 프로젝트 지연 손실 보험 (DSU/ALOP).

2.2 신기술 성능보증 리스크
신기술 성능 미달: HVDC, ESS 등 신기술 검증 과정에서 발생할 수 있는 성능보증 리스크.

ESS 화재 리스크: 리튬배터리 기반 ESS 시스템의 고화재 위험.

사이버 보안 리스크: 'ARMOUR', 'ARPS' 등 IT/OT 융합 시스템의 사이버 공격 위험.

보험 니즈: 기술 성능보증 보험 (Technology Performance Insurance), 제조물 책임보험 (Product Liability), 사이버 보험.

2.3 대형 건설 프로젝트 리스크
공사 지연 및 시공 하자: 조단위 규모의 아파트, 주상복합 등 대형 건설 프로젝트의 공기 지연 및 품질 관리 리스크.

안전사고 리스크: 중대재해처벌법에 따른 안전사고 발생 시 법적 책임 및 경영진 리스크.

보험 니즈: 건설공사보험 (CAR/EAR), 중대재해 대응 보험, 하자보수보험.

III. 록톤코리아의 차별화된 가치 제안
록톤코리아는 효성중공업의 복합적인 리스크 니즈에 대해 경쟁사와 차별화된 독보적인 가치를 제공합니다.

3.1 독립성과 고객 중심
록톤은 세계 최대 규모의 독립적인 보험중개회사로서, 특정 보험사에 종속되지 않고 오직 효성중공업의 이익을 최우선으로 하여 전 세계 보험사 상품을 비교 분석하고 최적의 솔루션을 제안합니다. 이는 '고객의 최선의 의사결정 자문'이라는 록톤의 본질적 가치를 극대화합니다.

3.2 강력한 글로벌 네트워크와 현지 전문성
효성중공업이 전 세계 119개 사업장을 운영하며 해외 프로젝트를 확대하는 상황에서, 록톤의 140개국 이상 글로벌 네트워크는 각국의 상이한 규제 환경과 현지 보험 시장에 대한 깊은 이해를 바탕으로 맞춤형 자문을 제공합니다. 특히, 한국 본사와 해외 현지 법인 간의 긴밀한 커뮤니케이션을 통해 효성중공업의 통합적인 글로벌 보험 프로그램 설계 및 관리를 지원합니다.

3.3 산업별/기술별 특화된 전문성
중공업, 플랜트, 신재생에너지(풍력, ESS, 수소) 등 효성중공업의 핵심 사업 분야에 대한 록톤의 깊은 이해와 전문적인 리스크 컨설팅 역량은, 단순히 보험 상품을 중개하는 것을 넘어 효성중공업의 특정 위험에 대한 미묘한 차이까지 파악하여 최적의 솔루션을 설계하는 데 강점입니다. 특히 HVDC, ESS, 수소 등 신기술 리스크에 대한 전문적인 보험 솔루션 개발 역량을 보유하고 있습니다.

3.4 차별화된 클레임 서비스 전문성
사고 발생 시 고객의 입장에서 보험사와 협상하고 신속하며 공정한 클레임 처리를 지원하는 록톤의 전문성은, 특히 대형 해외 프로젝트에서 발생할 수 있는 복잡한 클레임 상황에서 효성중공업의 손실을 최소화하는 데 결정적인 역할을 할 것입니다. 록톤의 98% 클레임 성공률은 강력한 증거이며, 24시간 글로벌 클레임 서비스 체계를 통해 효성중공업의 사업 연속성을 보장합니다.

3.5 정책 연계 전문성
정부 정책 변화를 실시간으로 모니터링하고, 이에 따른 보험 영향도를 분석하여 효성중공업에 선제적으로 맞춤형 보험 솔루션을 제안하는 역량을 보유하고 있습니다. K-SURE, KEXIM 등 정부 지원 정책과 연계한 보험료 할인 혜택 설계 등 비용 효율적인 방안도 제시합니다.

IV. 핵심 영업 전략 시나리오
A. 미국 보증보험 제안 시나리오
효성중공업은 미국 테네시주 멤피스 변압기 공장 확장(약 5억 달러 규모) 외에도 LA 태양광+ESS, 텍사스 HVDC 송배전, 뉴욕 배터리팩 등 대규모 에너지 프로젝트를 진행 중입니다. 미국 시장은 전문 보증보험사 수가 제한적이고 브로커의 역할이 결정적인 만큼, 록톤코리아의 역할이 중요합니다.

테네시 멤피스 변압기 프로젝트: 록톤 미국 지사의 Surety팀이 Travelers, Liberty Mutual 등 해외 대형 보험사와 협력하여 성능보증(Performance Bond) 및 이행보증(Payment Bond) 보험을 설계·조달합니다. 특히 AI 데이터센터 및 전력망 초대형 프로젝트의 핵심 설비인 765kV 초고압 변압기 생산에 필요한 금융 보증을 지원합니다.

LA 태양광+ESS 프로젝트: EPC 계약 이행보증 및 ESS 화재위험보증 등 PF 조건에 부합하는 EPC 보증보험과 배터리 화재보험 패키지를 현지 보험사와 협력하여 설계하며, ESS 고유 리스크에 대비한 특약을 반영합니다.

텍사스 HVDC 송전 프로젝트: 미국 인프라 투자계획(IIJA)과 연계된 송전망 구축 사업에 필요한 건설공사보험 및 장비보증을 제공하며, US Ex-Im Bank 등 금융기관의 보증 프로그램과 연계한 종합 보증 패키지를 제안합니다.

뉴욕 배터리팩 프로젝트: 생산 및 납품 지연 리스크를 최소화하기 위한 계약보증 및 품질보증 보험을 글로벌 네트워크를 통해 미국·유럽 재보험사와 협업하여 통합 설계하고, K-SURE 등 국내외 보증 프로그램과 연계합니다.

록톤의 강점: 록톤 미국 지사의 전 세계 2,000여 개 고객을 대표하는 글로벌 최대 규모의 보증보험 중개 조직은 효성중공업의 미국 대형 수주 프로젝트에 맞춘 차별화된 보증보험 솔루션을 제공하여, 프로젝트 리스크를 줄이고 현지 금융기관 및 협력사와의 원활한 계약 체결을 지원합니다.

B. 국내 신재생 SPC 보험 제안 시나리오
국내 신재생에너지 SPC 사업은 PF 대출 단계에서 각종 보험 가입이 의무화됩니다. 록톤코리아는 국내 신재생에너지 분야에서 쌓은 전문성을 바탕으로 맞춤형 보험 솔루션을 제공합니다.

풍력-ESS 융합 프로젝트: 풍력터빈과 ESS 설비의 기계·설비 손상 위험에 대비하여 발전설비(풍력 터빈, 변압기)에 대한 **기관·기계종합보험(CMI)**을 적용하고, 고화재위험 ESS에 대한 별도의 화재보험 특약을 포함합니다. 또한, 발전량 변동 리스크를 줄이기 위한 출력보증보험을 제안하여 PF 대출기관의 수익성 리스크를 완화합니다.

태양광 SPC 프로젝트: 발전 패널, 인버터 등 설비에 대한 CMI와 화재·태풍보험을 기본으로, 공사 기간 동안 **건설공사보험(All Risks)**을, 가동 이후에는 통합 재산종합보험 및 배상책임보험을 적용합니다. 토지 임대 시 토지소유자 배상책임을 포함한 종합 보장을 설계하며, 필요시 정책성 공제상품과 연계하여 보험료 부담을 완화합니다.

배터리팩(ESS) 전용 프로젝트: 화재 외에 사이버 위험, 전력망 연계 사고 등 특수 위험을 고려하여, 전력계통 불안정 시 손실을 보장하는 전력망 운용보험이나 발전량 저하에 따른 손실보상 보험을 포함하는 통합 패키지를 제안합니다.

록톤의 강점: 록톤은 대형 건설·인프라 보험과 태양광 전문성을 결합하여 구축, 운영 단계별 리스크를 통합 관리하며, 특히 ESS 등 신기술 보험에 전문화된 경험을 갖추고 있습니다. 효성중공업의 국내 SPC 사업에 대해 록톤은 초기 설계부터 PF 대출조건, 운영 리스크를 모두 반영한 종합 보험 패키지를 제안함으로써, 금융기관 승인과 사업 안정성을 동시에 지원합니다.

C. 우태희 대표이사 관계 레버리지 전략
우태희 대표이사님의 정책 전문성, 기술 비전, 그리고 광범위한 산업 네트워크는 록톤코리아가 효성중공업과 전략적 파트너십을 구축하는 데 핵심적인 레버리지입니다.

신재생에너지 정책 연계 보험 컨설팅: 우태희 대표의 정책 전문성을 활용하여 록톤을 "정책 변화에 선제적으로 대응하는 보험 전략 컨설팅 파트너"로 포지셔닝합니다. 수소 충전소 특화 보험, 해상풍력 프로젝트 종합보험, ESG 인증 연계 보험 할인 프로그램 등 정책 연계 보험 솔루션을 공동 개발하고, 정책 리스크 헤지 서비스를 제공합니다.

기술 혁신 지원 보험 파트너십: 국내 최초 200MW급 전압형 HVDC 기술에 대한 성능보증보험을 선제적으로 제안하고, ESS 화재, 성능, 사이버 리스크를 종합적으로 보장하는 ESS 특화 보험을 제공합니다. 수소 생산, 저장, 운송 각 단계별 특화 리스크 보험을 개발하여 수소 생태계 보험 파트너로 자리매김합니다.

글로벌 확장 지원 전략: 미국(멤피스), 인도(푸네), 중국(장쑤성) 등 해외 거점별 현지 보험 관리를 지원하고, 록톤 글로벌 네트워크와 효성 해외 거점을 연계한 통합 서비스를 제공합니다. 나미비아, 에티오피아 등 신흥국 프로젝트에 대한 정치적 위험보험 전문성을 활용하여 G2G 프로젝트 특화 보험 솔루션을 개발합니다.

핵심 메시지: "우태희 대표님의 에너지 정책 비전과 록톤의 글로벌 보험 전문성을 결합하여, 효성중공업의 신재생에너지 사업 확장을 보험 관점에서 전략적으로 지원하고 싶습니다."

D. 이재명 정부 정책 연계 보험 제안 논리
이재명 정부의 해외 진출 지원, 신재생에너지 확대, 데이터센터 투자 정책은 효성중공업에게 거대한 사업 기회를 제공하며, 록톤코리아는 이러한 정책 변화를 정확히 이해하고 선제적으로 대응하는 보험 솔루션을 제공합니다.

해외 진출 지원 정책 연계 보험: 효성중공업의 미국 멤피스 공장, 사우디 네옴시티 등 대형 해외 프로젝트에 대한 금융 지원 확대에 맞춰 정치적 위험보험, 해외투자보험 연계 프로그램(K-SURE 연계), 프로젝트 파이낸싱 연계 건설공사보험 및 완공보증보험을 제안합니다.

신재생에너지 확대 정책 연계 보험: 'U자형 에너지 고속도로' 구축에 따른 HVDC 수요 증가, ESS 시장 확대, 해상풍력 프로젝트 발주 가속화에 대응하여 HVDC 기술보험 특화 상품(성능보증, 기술이전, 시운전보험), ESS 통합 리스크 관리 솔루션(화재, 출력보증, 사이버보험), 해상풍력 프로젝트 종합보험을 제안합니다.

데이터센터 투자 정책 연계 보험: 100조 원 규모의 국가 AI 인프라 및 데이터센터 균형 확충 계획에 따라 초고압 변압기, ESS 등 전력설비 수요 증가에 맞춰 고신뢰성 전력설비 특화보험(정전보험, 장비보험, 성능보증보험), 사이버 보안 통합 솔루션(사이버보험, 데이터 복구보험, 운영중단보험), 건설 및 시운전 특화보험을 제안합니다.

록톤 차별화: 록톤코리아는 국내 정책 변화에 대한 깊은 이해와 선제적 대응 능력, 효성중공업 핵심 기술에 대한 전문적 보험 설계, 정부 지원 정책과 연계한 비용 효율성, 그리고 중견 브로커의 유연성을 활용한 신속한 의사결정 및 실행으로 경쟁사 대비 명확한 우위를 가집니다.

V. 통합 보험 솔루션 제안 논리
록톤코리아는 효성중공업의 다양한 사업 영역과 리스크 프로파일을 고려하여, 개별 보험 상품을 넘어선 통합적이고 전략적인 보험 솔루션을 제안합니다.

글로벌 통합 프로그램 (Master Program): 한국 본사에서 전 세계 119개 사업장 및 해외 프로젝트를 통합 관리하는 마스터 정책을 설계하고, 각국 법적 요구사항을 충족하는 로컬 정책을 연계하여 글로벌 리스크를 효율적으로 관리합니다.

신기술 리스크 통합 관리: HVDC, ESS, 수소 등 첨단 기술에 대한 성능보증, 화재, 사이버, 출력보증 리스크를 하나의 패키지로 묶어 예측 불가능한 신기술 위험에 선제적으로 대응합니다.

대형 프로젝트 맞춤형 패키지: 미국 보증보험, 해외 프로젝트 정치적 위험 보험, 국내 신재생 SPC 보험, 데이터센터 건설 및 운영 보험 등 대규모 프로젝트의 전 생애주기 리스크를 포괄적으로 보장하는 맞춤형 패키지를 제공합니다.

정책 연계 및 비용 효율성: 정부의 해외 진출 지원, 신재생에너지 확대, 데이터센터 투자 정책과 연계하여 K-SURE, KEXIM 등 정책금융 활용을 통해 보험료를 최적화하고, 정부 인증 프로젝트에 대한 우대 조건을 적용합니다.

대체 위험 전가 (Alternative Risk Transfer, ART) 솔루션: 장기적으로 효성중공업 전용 캡티브 보험사 설립을 지원하여 보험 비용 20-30% 절감 및 리스크 관리 고도화를 도모하고, 파라메트릭 보험 등 혁신적인 솔루션을 통해 자연재해, 프로젝트 지연, 에너지 생산량 변동 리스크에 신속하게 대응합니다.

ESG 통합 보험 솔루션: 효성중공업의 ESG 경영 목표와 연계하여 탄소중립 달성 지원 보험, ESG 경영 리스크 보험 등을 제안하여 지속 가능한 성장을 지원합니다.

VI. 실행 로드맵 및 우선순위
록톤코리아는 다음 로드맵에 따라 효성중공업과의 파트너십을 구축하고 확장해 나갈 것입니다.

6.1 단기 실행 계획 (1-3개월)
우선순위 1: 우태희 대표이사 첫 미팅 성사: 신재생에너지 정책 연계 보험 전략 제안을 핵심 메시지로 관계를 구축하고 니즈를 파악합니다.

우선순위 2: 미국 보증보험 제안 및 첫 거래 성사: 테네시 멤피스 공장 등 미국 프로젝트에 대한 보증보험 패키지를 제안하고, 록톤 미국 지사 연계를 통해 첫 거래를 성사시켜 연간 50억 원 규모의 보험료 수주를 목표로 합니다.

우선순위 3: ESS 화재보험 특화 상품 제안: 밀양 부북변전소 등 대형 ESS 프로젝트를 대상으로 기술 전문성을 입증하고 차별화를 확보하여 연간 30억 원 규모의 보험료 수주를 목표로 합니다.

우선순위 4: 데이터센터 전력설비 보험 패키지 제안: 정부 주도 AI 데이터센터 프로젝트 참여분을 대상으로 정책 연계 보험의 실질적 성과를 창출하여 연간 30억 원 규모의 보험료 수주를 목표로 합니다.

현재 보험 현황 분석: 효성중공업의 기존 보험 계약 및 보험료 규모를 조사하여 개선 방안을 제시합니다.

6.2 중기 실행 계획 (3-12개월)
HVDC 기술보험 패키지 개발 및 제안: 'U자형 에너지 고속도로' 프로젝트를 대상으로 국내 최초 기술보험으로 시장을 선도하여 연간 80억 원 규모의 보험료 수주를 목표로 합니다.

네옴시티 프로젝트 종합보험 참여: 사우디 프로젝트 보험 중개에 참여하며 록톤 중동 지사와의 협력을 강화합니다.

정기 리뷰 체계 구축: 분기별 리스크 리뷰 및 보험 전략 점검을 통해 관계를 심화합니다.

기술자문 서비스 제공: 신기술 개발 시 보험 관점의 사전 자문을 제공합니다.

6.3 장기 실행 계획 (1-3년)
글로벌 통합 보험 프로그램 제안 및 구축: 효성중공업 전 세계 사업장을 대상으로 마스터 정책과 로컬 정책을 통합 관리하여 연간 200억 원 규모의 보험료 수주를 목표로 합니다.

캡티브 보험사 설립 지원: 효성 전용 캡티브 보험사 설립을 지원하여 보험 비용 절감 및 리스크 관리 고도화를 돕습니다.

ESG 보험 통합 솔루션 제공: 탄소중립 달성 지원 종합 보험 프로그램 등 ESG 경영 리스크 관련 보험을 제안합니다.

신사업 동반 진출: 효성의 신사업 진출 시 보험 파트너 역할을 수행하며 전략적 파트너십을 구축합니다.

VII. 기대 효과 및 성공 지표
7.1 정량적 효과
매출 기여도: 3년 내 효성중공업 관련 연간 보험료 수주 목표 200억 원, 관련 계열사 확장을 통한 추가 수주 100억 원, 레퍼런스 효과를 통한 타 에너지 기업 수주 300억 원. 총 3년 내 연간 600억 원 보험료 수주 달성 가능.

시장 포지셔닝: 국내 신재생에너지 보험 시장 점유율 20% 달성, 대형 에너지 기업 대상 보험 브로커 Top 3 진입.

7.2 정성적 효과
브랜드 가치: "에너지 정책 전문 보험 브로커", "정부-기업 간 가교 역할 수행 전문 브로커", "신기술 리스크 관리 전문가 그룹" 이미지 구축.

관계 자산: 정부 정책 입안자들과의 네트워크 확장, 에너지 업계 핵심 인사들과의 관계 구축, 글로벌 에너지 기업들과의 파트너십 기회 창출.

고객 만족도: 효성중공업의 리스크 관리 효율성 증대 및 최적의 보험 솔루션 제공을 통한 만족도 극대화.

VIII. 결론 및 최종 제언
효성중공업은 전력 슈퍼사이클의 핵심 수혜기업으로서 글로벌 사업 확장과 신기술 개발이라는 두 축을 중심으로 폭발적 성장을 지속하고 있으며, 이는 록톤코리아에게 조단위 규모의 보험중개 기회를 제공합니다.

록톤코리아는 독립성, 강력한 글로벌 네트워크, 산업별/기술별 전문성, 그리고 차별화된 클레임 서비스 및 정책 연계 전문성을 바탕으로 효성중공업의 복잡한 글로벌 리스크를 효과적으로 관리하고, 최적의 보험 솔루션을 제공할 수 있는 독보적인 위치에 있습니다.

조대표님께 드리는 최종 제언:

즉시 실행: 우태희 대표이사 미팅 일정을 최우선으로 확보하고, 클레임 서비스 차별화 자료(록톤의 98% 클레임 성공률 등)를 즉시 준비하여 효성중공업에 제시할 수 있도록 합니다. K-SURE, KEXIM 등 정부 기관과의 네트워킹을 시작하여 정책 연계 보험 솔루션의 실행력을 높입니다.

팀 역량 강화: 전력기기 및 신재생에너지 분야의 전문 지식 습득을 지속하고, 록톤 미국, 인도, 중동 지사 등 해외 지사와의 협력 체계를 더욱 강화하여 효성중공업의 글로벌 니즈에 완벽하게 대응합니다.

장기 투자: 단순 보험 중개를 넘어선 리스크 파트너십 구축을 목표로 효성중공업과의 관계에 지속적으로 투자하며, 효성의 성장과 함께하는 동반성장 모델을 확립합니다.

효성중공업은 록톤코리아가 글로벌 톱티어 보험중개사로 도약할 수 있는 핵심 고객이 될 것입니다. 이제 완성된 전략을 바탕으로 신속하고 과감한 실행이 성공의 열쇠입니다.
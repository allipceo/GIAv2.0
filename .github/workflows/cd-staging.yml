name: Deploy to Staging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: asia-northeast3-docker.pkg.dev
  REPOSITORY: zobis
  IMAGE_NAME: zobis-server
  SERVICE_NAME: zobis-staging
  REGION: asia-northeast3

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker to use gcloud as a credential helper
      run: |
        gcloud auth configure-docker ${{ env.REGISTRY }}

    - name: Extract image tag
      id: image-tag
      run: |
        if [[ "${{ github.event_name }}" == "push" ]]; then
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          echo "tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to Cloud Run (Staging)
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 10 \
          --concurrency 100 \
          --timeout 300 \
          --set-env-vars ENV=staging \
          --set-secrets NOTION_TOKEN=notion-token-staging:latest,HMAC_SECRET=hmac-secret-staging:latest,SLACK_WEBHOOK=slack-webhook-staging:latest

    - name: Wait for deployment
      run: |
        sleep 30

    - name: Health check
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format="value(status.url)")
        echo "Service URL: $SERVICE_URL"
        
        # Health check with retry
        for i in {1..5}; do
          echo "Health check attempt $i"
          if curl -f "$SERVICE_URL/healthz"; then
            echo "Health check passed"
            break
          else
            echo "Health check failed, retrying in 10 seconds..."
            sleep 10
          fi
        done

    - name: Performance test
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format="value(status.url)")
        
        # Measure response times
        echo "Measuring /healthz response times..."
        for i in {1..3}; do
          start_time=$(date +%s%3N)
          curl -s "$SERVICE_URL/healthz" > /dev/null
          end_time=$(date +%s%3N)
          duration=$((end_time - start_time))
          echo "Request $i: ${duration}ms"
        done

    - name: Update traffic (Progressive deployment)
      run: |
        # Progressive traffic allocation: 10% -> 50% -> 100%
        echo "Setting traffic to 10%"
        gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --to-revisions=LATEST=10
        
        sleep 30
        
        echo "Setting traffic to 50%"
        gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --to-revisions=LATEST=50
        
        sleep 30
        
        echo "Setting traffic to 100%"
        gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
          --region=${{ env.REGION }} \
          --to-revisions=LATEST=100

    - name: Final health check
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format="value(status.url)")
        curl -f "$SERVICE_URL/healthz"
        curl -f "$SERVICE_URL/health"

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Staging deployment successful"
        echo "Service URL: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')"

  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    needs: deploy-staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Deploy to Cloud Run (Production)
      run: |
        gcloud run deploy zobis-production \
          --image ${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --memory 1Gi \
          --cpu 2 \
          --min-instances 1 \
          --max-instances 100 \
          --concurrency 1000 \
          --timeout 300 \
          --set-env-vars ENV=production \
          --set-secrets NOTION_TOKEN=notion-token-production:latest,HMAC_SECRET=hmac-secret-production:latest,SLACK_WEBHOOK=slack-webhook-production:latest

    - name: Production health check
      run: |
        SERVICE_URL=$(gcloud run services describe zobis-production --region=${{ env.REGION }} --format="value(status.url)")
        curl -f "$SERVICE_URL/healthz"
        curl -f "$SERVICE_URL/health"

    - name: Notify production deployment
      run: |
        echo "🚀 Production deployment successful"
        echo "Service URL: $(gcloud run services describe zobis-production --region=${{ env.REGION }} --format='value(status.url)')"
